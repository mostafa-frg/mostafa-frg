name: Deploy MOSTA platform
# Keep deployment workflow in sync with the current first-admin setup flow.
# Refresh bootstrap secret after administrator token rotation.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "portfolio/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosta-platform-deploy-v2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate application files
        run: |
          set -euo pipefail
          node --check backend/src/index.js
          node --check portfolio/assets/auth.js
          node --check portfolio/assets/dashboard.js
          node --check portfolio/assets/account.js
          node --check backend/tests/api-security.mjs
          node --check portfolio/assets/site.js
          node --check portfolio/assets/home.js
          node -e "JSON.parse(require('fs').readFileSync('backend/wrangler.jsonc','utf8'))"
          test -s portfolio/index.html
          test -s portfolio/auth.html
          test -s portfolio/dashboard.html
          test -s backend/migrations/0001_init.sql
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          import glob
          for f in sorted(glob.glob('backend/migrations/*.sql')):
              db.executescript(open(f, encoding='utf-8').read())
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {'users','sessions','auth_attempts','tool_access','audit_logs'}
          assert required <= tables, f"Missing tables: {required - tables}"
          cols = {r[1] for r in db.execute('PRAGMA table_info(users)')}
          assert 'password_iter' in cols, 'password_iter column missing'
          indexes = {r[1] for r in db.execute("PRAGMA index_list(users)")}
          assert 'idx_single_admin' in indexes, "Single-admin constraint missing"
          assert not list(db.execute("PRAGMA foreign_key_check")), "Foreign-key check failed"
          print("D1 schema validation passed.")
          PY

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."; exit 1; }
      - name: Install Wrangler
        run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Ensure D1 database exists
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          response="$(curl -fsS "$api" "${headers[@]}")"
          db_id="$(jq -r '[.result[]? | select(.name == "mosta-platform")][0].uuid // empty' <<< "$response")"
          if [ -z "$db_id" ]; then
            response="$(curl -fsS -X POST "$api" "${headers[@]}" --data '{"name":"mosta-platform"}')"
            db_id="$(jq -er '.result.uuid' <<< "$response")"
            echo "Created D1 database mosta-platform."
          else
            echo "Using existing D1 database mosta-platform."
          fi
          node - "$db_id" <<'NODE'
          const fs = require('node:fs');
          const id = process.argv[2];
          if (!id || id.length < 20) throw new Error('Cloudflare returned an invalid D1 database ID.');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases[0].database_id = id;
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(config, null, 2) + '\n');
          NODE
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
        working-directory: backend
      - name: Ensure IP hashing secret exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler secret list --config wrangler.deploy.json 2>/dev/null | grep -q '"IP_HASH_SECRET"'; then
            echo "IP_HASH_SECRET is already configured."
          else
            openssl rand -base64 48 | npx wrangler secret put IP_HASH_SECRET --config wrangler.deploy.json
            echo "Generated IP_HASH_SECRET on the Worker (value never printed or stored in GitHub)."
          fi
        working-directory: backend
      - name: Manage one-time administrator bootstrap token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_BOOTSTRAP_TOKEN: ${{ secrets.ADMIN_BOOTSTRAP_TOKEN }}
          WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN || 'frh7977' }}
        run: |
          set -euo pipefail
          state="$(curl -fsS -m 20 "https://mostafa-frg.${WORKERS_SUBDOMAIN}.workers.dev/api/auth/setup-status" 2>/dev/null || true)"
          if printf '%s' "$state" | grep -q '"setupRequired":false'; then
            echo "An administrator already exists: removing the one-time bootstrap secret from the Worker."
            printf 'y\n' | npx wrangler secret delete ADMIN_BOOTSTRAP_TOKEN --config wrangler.deploy.json || echo "Bootstrap secret was not set."
          elif [ -n "$ADMIN_BOOTSTRAP_TOKEN" ]; then
            echo "No administrator yet and a bootstrap token is available; configuring it on Worker mostafa-frg."
            printf '%s' "$ADMIN_BOOTSTRAP_TOKEN" | npx wrangler secret put ADMIN_BOOTSTRAP_TOKEN --config wrangler.deploy.json
          else
            echo "No administrator yet and ADMIN_BOOTSTRAP_TOKEN is not set; first-admin setup stays locked."
          fi
        working-directory: backend
      - name: Deploy Worker and static portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.json
        working-directory: backend
      - name: Verify live API health
        run: |
          set -u
          url="https://mostafa-frg.${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN || 'frh7977' }}.workers.dev/api/health"
          for i in 1 2 3 4 5 6; do
            code="$(curl -sS -o body.txt -w '%{http_code}' "$url" || true)"
            echo "attempt $i: HTTP $code"; head -c 300 body.txt; echo
            if [ "$code" = "200" ] && grep -q '"ok":true' body.txt; then echo "API is live."; exit 0; fi
            sleep 10
          done
          echo "::error::$url did not return the MOSTA health JSON. If this is 404, another deployment (e.g. Cloudflare Git integration) may be serving the worker name."
          exit 1
