name: Deploy MOSTA platform
on:
  push:
    branches: [main]
    paths: ["backend/**", "portfolio/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mosta-platform
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          node --check backend/src/index.js
          node --check portfolio/assets/auth.js
          node --check portfolio/assets/dashboard.js
          node -e "JSON.parse(require('fs').readFileSync('backend/wrangler.jsonc','utf8'))"
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.executescript(open('backend/migrations/0001_init.sql', encoding='utf-8').read())
          assert db.execute(\"SELECT name FROM sqlite_master WHERE type='index' AND name='idx_single_admin'\").fetchone()
          print('D1 migration schema passed.')
          PY
          test -s backend/migrations/0001_init.sql
          test -s portfolio/auth.html
          test -s portfolio/dashboard.html
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
        working-directory: backend
      - run: npm run deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
