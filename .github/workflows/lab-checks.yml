name: lab-checks
on:
  push:
    paths:
      - "cyber-labs/**"
      - ".github/workflows/lab-checks.yml"
  pull_request:
    paths:
      - "cyber-labs/**"

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python labs
        run: python -m compileall -q cyber-labs
