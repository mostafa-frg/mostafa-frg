name: MOSTA CLI Tool Index Checks

on:
  pull_request:
    paths:
      - "cyber-labs/mosta-tool-index/**"
      - ".github/workflows/mosta-tool-index.yml"
  push:
    branches: [main]
    paths:
      - "cyber-labs/mosta-tool-index/**"
      - ".github/workflows/mosta-tool-index.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile validator
        run: python -m py_compile cyber-labs/mosta-tool-index/validate_catalog.py
      - name: Validate existing CLI catalog
        working-directory: cyber-labs/mosta-tool-index
        run: python validate_catalog.py tools.csv
      - name: Run catalog validator unit tests
        working-directory: cyber-labs/mosta-tool-index
        run: python -m unittest discover -s . -p "test_*.py" -v
