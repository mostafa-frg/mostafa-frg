services:
  web01:
    image: nginx:1.27-alpine
    networks:
      labnet:
        ipv4_address: 10.60.0.10
  dns01:
    image: andyshinn/dnsmasq:2.89
    command: ["--no-daemon", "--log-facility=-", "--address=/lab.local/10.60.0.10"]
    networks:
      labnet:
        ipv4_address: 10.60.0.53
  edge:
    image: alpine:3.20
    command: ["sh", "-c", "sleep infinity"]
    networks:
      labnet:
        ipv4_address: 10.60.0.1
  monitor:
    image: python:3.12-alpine
    working_dir: /opt/lab
    command: ["python", "healthcheck.py"]
    volumes:
      - ./monitor:/opt/lab:ro
    networks:
      labnet:
        ipv4_address: 10.60.0.20
    depends_on:
      - web01
      - dns01
networks:
  labnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.60.0.0/24
