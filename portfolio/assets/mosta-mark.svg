<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">MOSTA — Network Monogram</title>
<desc id="desc">A custom geometric M monogram built from connected network paths, in lime on a graphite shield.</desc>
<defs>
 <linearGradient id="field" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#20291b"/><stop offset="1" stop-color="#0b100b"/></linearGradient>
 <linearGradient id="mark" x1="27" y1="29" x2="100" y2="101" gradientUnits="userSpaceOnUse"><stop stop-color="#efffc9"/><stop offset=".48" stop-color="#c7f36b"/><stop offset="1" stop-color="#83b82e"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M31 5.5h66L122.5 31v66L97 122.5H31L5.5 97V31L31 5.5Z" fill="url(#field)" stroke="#c7f36b" stroke-opacity=".68" stroke-width="1.7"/>
