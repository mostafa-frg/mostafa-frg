<path d="M17 24 29 32M111 24 99 32M17 104l12-8M111 104 99 96" fill="none" stroke="#c7f36b" stroke-opacity=".72" stroke-width="1.6" stroke-linecap="round"/>
<g fill="#f1ffd9" stroke="#15200f" stroke-width="2.5"><circle cx="15" cy="19" r="5.5"/><circle cx="113" cy="19" r="5.5"/><circle cx="15" cy="109" r="5.5"/><circle cx="113" cy="109" r="5.5"/></g>
<circle cx="64" cy="64" r="53" fill="none" stroke="#c7f36b" stroke-opacity=".08" stroke-dasharray="1 7"/>
</svg>